grasp_real:
  ros__parameters:
    joint_state_topic: /dg5f_s_left/joint_states
    effort_topic: /dg5f_s_left/effort_controller/commands
    command_topic: /grasp_type
    pose_topic: /pose_type
    alpha1_topic: /dg5f_grasp_control/alpha1_cmd
    relative_translation_topic: /dg5f_grasp_control/relative_translation_cmd
    relative_rotation_deg_topic: /dg5f_grasp_control/relative_rotation_deg_cmd
    rotation_matrix_topic: /dg5f_grasp_control/rotation_matrix_cmd
    teaching_mode_topic: /dg5f_grasp_control/teaching_mode
    debug_topic: /dg5f_grasp_control/debug
    debug_frame_id: link_base
    debug_publish_hz: 20.0

    dt: 0.005
    hand_limit: 7.5
    log_dt: 0.25

    use_finger_count: 3

    pose_kp: 0.4
    pose_kd: 0.05
    pose_pd_limit: 0.25

    fric_scale: 0.7
    fric_tanh_k: 20.0
    fric_limit: 0.5
    qdot_alpha: 0.5

    alpha1: 3.0
    groped_tau_limit: 3.0
    groped_force_direction_sign: 1.0
    thumb_centroid_bias: 0.5
    # Reject near-degenerate regular-grasp solutions that amplify another alpha
    # beyond this multiple of the thumb alpha1.
    rotation_force_balance_max_alpha_ratio: 10.0
    # Fade the last valid regular-grasp command to zero on a balance failure.
    force_balance_error_ramp_sec: 0.5
    # Virtual-force diagnostics and zero-resultant shape stabilization. The
    # centroid motion itself uses the DLS joint-position settings below.
    relative_translation_max_m: 0.010
    relative_translation_kp: 600.0
    relative_translation_kd: 6.0
    # Softer orthogonal hold and zero-resultant fingertip-shape stabilization.
    relative_translation_hold_kp: 120.0
    relative_translation_hold_kd: 1.2
    relative_translation_shape_kp: 120.0
    relative_translation_shape_kd: 1.2
    relative_translation_cross_axis_deadband_m: 0.0003
    # Smooth the Cartesian reference instead of applying a position step.
    relative_translation_reference_ramp_sec: 0.7
    # Cartesian diagnostic/shape force limits.
    relative_translation_force_limit: 8.50
    relative_translation_per_finger_force_limit: 5.50
    relative_translation_velocity_alpha: 0.20
    relative_translation_position_tolerance_m: 0.0005
    relative_translation_velocity_tolerance_mps: 0.003
    relative_translation_settle_sec: 0.20
    relative_translation_timeout_sec: 3.0
    # Same centroid DLS position controller is used for X, Y, and Z. Existing
    # grasp/shape torque is projected into the centroid task null space.
    relative_translation_dls_damping: 0.005
    relative_translation_nullspace_rcond: 0.00001
    relative_translation_joint_kp: 1.20
    relative_translation_joint_kd: 0.06
    relative_translation_joint_correction_limit_rad: 0.30
    relative_translation_position_torque_limit: 0.30
    relative_translation_nullspace_grasp_gain: 1.0
    jacobian_eps: 0.000001

    min_tip_distance: 0.018
    collision_repel_gain: 100.0
    collision_repel_limit: 0.8

    # Capsule-based avoidance between adjacent fingers.
    # Surface clearance is capsule centerline distance minus both radii.
    # Index/middle/ring move joint 1; pinky moves joint 2.
    inactive_collision_avoidance_enable: true
    inactive_collision_capsule_radius_m: 0.009
    inactive_collision_activation_clearance_m: 0.009
    inactive_collision_critical_clearance_m: 0.002
    inactive_collision_release_hysteresis_m: 0.001
    inactive_collision_max_joint1_offset_rad: 0.40
    inactive_collision_joint1_target_rate_radps: 1.2
    inactive_collision_prediction_sec: 0.18
    # Dedicated selected-joint PD used only while avoidance is active/returning.
    inactive_collision_pd_kp: 0.5
    inactive_collision_pd_kd: 0.10
    inactive_collision_pd_limit: 0.25
    inactive_collision_gradient_eps_rad: 0.0174533
    # Keep the previous direction unless +/-1 deg differs by at least 0.1 mm.
    inactive_collision_direction_min_delta_m: 0.00010
    inactive_collision_joint_limit_margin_rad: 0.03
    # Ignore the naturally close palm-side root segment; monitor moving links.
    inactive_collision_first_segment: 1

    # Closed-loop relative rotation for regular grasp types 1..5. Positive is
    # right-hand-rule rotation about the palm normal (link_base -X).
    # Fixed command-time fingertip targets use normalized Cartesian PD;
    # the resulting force is added directly to the ordinary grasp force.
    relative_rotation_max_abs_deg: 45.0
    relative_rotation_reference_ramp_sec: 0.5
    relative_rotation_position_kp: 48.0
    relative_rotation_position_kd: 0.80
    relative_rotation_position_error_limit_m: 0.025
    relative_rotation_position_tolerance_m: 0.002
    relative_rotation_force_limit: 10.00
    relative_rotation_radius_min: 0.015
    relative_rotation_velocity_alpha: 0.20
    relative_rotation_timeout_sec: 2.0

    # grasp_type=7 rotation assist.
    # theta is not closed-loop object angle; it scales tangential rotation force.
    # Change rotation_theta_rad sign if the object rotates in the opposite direction.
    rotation_enable_for_grasp_type7: true
    rotation_theta_rad: 0.174533
    rotation_gain: 0.25
    rotation_force_limit: 0.75
    rotation_radius_min: 0.035
    # Cleaner in-place rotation:
    # - zero_net_force removes the translation component of the rotation assist.
    # - use_radius_compensation=false prevents near-centroid fingers from dominating.
    # - nominal_radius sets the constant denominator used when radius compensation is off.
    # pure_moment solves a least-norm internal force distribution that makes
    # net rotation force ~= 0 while generating a moment about palm normal.
    # This is more stable for in-place rotation than per-finger tangent force.
    grasp_type7_rotation_mode: pure_moment
    grasp_type7_rotation_zero_net_force: true
    grasp_type7_rotation_use_radius_compensation: false
    grasp_type7_rotation_nominal_radius: 0.060
    rotation_palm_normal_x: -1.0
    rotation_palm_normal_y: 0.0
    rotation_palm_normal_z: 0.0


    # grasp_type=7 rotation-center hold.
    # Grasp force still uses thumb-biased Cv, but rotation and center hold use
    # the unbiased geometric centroid captured at rotation_start.
    grasp_type7_center_hold_enable: true
    grasp_type7_center_hold_gain: 1.0
    grasp_type7_center_hold_force_limit: 0.10
    grasp_type7_center_hold_project_to_rotation_plane: true

    # grasp_type=7 rotation state detection.
    # Active grasp-finger qdot_max must stay below the threshold for the hold time.
    # Phase: grasp_stabilizing -> rotating -> rotation_done.
    # After rotation_done, the first index transition step can be executed.
    grasp_type7_start_qdot_threshold: 0.08
    grasp_type7_start_hold_sec: 0.20
    grasp_type7_done_qdot_threshold: 0.08
    grasp_type7_done_hold_sec: 0.20
    grasp_type7_min_rotation_sec: 0.50
    grasp_type7_stop_rotation_when_done: true
    # Repeat: rotation -> index/middle/thumb/ring transition -> rotation -> ...
    # until another /grasp_type or /pose_type command changes the state.
    grasp_type7_repeat_transition_cycle: true


    # grasp_type=7 first transition step after rotation_done.
    # Current scope: index finger only.
    # 1) remove index from active grasp set first, so centroid/force redistributes
    #    to thumb+middle+ring before detaching the index.
    # 2) PD-control index to pose_type=2 index joints until max angle error <= 5 deg.
    # 3) PD-control only index joint_2_1 target to 45 deg, holding the other index
    #    joints at pose_type=2, until max angle error <= 5 deg.
    # 4) reattach index toward the current centroid with J^T torque.
    grasp_type7_index_transition_enable: true
    grasp_type7_index_pd_tolerance_rad: 0.0872665
    grasp_type7_index_first_joint_target_rad: 0.785398
    grasp_type7_index_attach_force: 1.0
    grasp_type7_index_attach_tau_limit: 0.8

    # grasp_type=7 second transition step after index reattachment.
    # Middle joint_3_1 moves to 30 deg; middle joints 2~4 hold pose_type=2.
    grasp_type7_middle_transition_enable: true
    grasp_type7_middle_first_joint_target_rad: 0.523599
    grasp_type7_middle_attach_force: 1.0
    grasp_type7_middle_attach_tau_limit: 0.8

    # grasp_type=7 third transition step after middle reattachment.
    # Before detaching thumb, active grasp set becomes index+middle+ring, so the
    # centroid is the mean of currently contacting fingers. Thumb PD target is
    # [0 deg, 140 deg, 0 deg, pose_type=2 thumb joint_1_4], then thumb reattaches by J^T torque toward
    # a thumb-biased centroid.
    grasp_type7_thumb_transition_enable: true
    grasp_type7_thumb_joint1_target_rad: 0.0
    grasp_type7_thumb_joint2_target_rad: 2.443461
    grasp_type7_thumb_joint3_target_rad: 0.0
    grasp_type7_thumb_joint4_target_rad: -0.2340
    grasp_type7_thumb_attach_force: 1.0
    grasp_type7_thumb_attach_tau_limit: 0.8

    # grasp_type=7 fourth transition step after thumb reattachment.
    # Ring joint_4_1 moves to 9 deg; ring joints 2~4 hold pose_type=2.
    # Thumb remains attached, so the ordinary thumb-biased centroid is used.
    grasp_type7_ring_transition_enable: true
    grasp_type7_ring_first_joint_target_rad: 0.157080
    grasp_type7_ring_attach_force: 1.0
    grasp_type7_ring_attach_tau_limit: 0.8

    # Shared attach completion detector before moving to the next transition finger.
    grasp_type7_transition_attach_qdot_threshold: 0.08
    grasp_type7_transition_attach_hold_sec: 0.20
    grasp_type7_transition_attach_min_sec: 0.30

    # grasp_type=6: enveloping grasp mode
    # time-only sequence:
    #   1) non-thumb 2nd joints
    #   2) non-thumb 3rd joints
    #   3) non-thumb 4th joints + thumb 3rd joint
    #   4) thumb 4th joint
    # torque per active joint = alpha1 * envelop_tau_scale
    # previous 0.25 was too strong on hardware, so this default is reduced.
    envelop_tau_scale: 0.025
    envelop_joint_delay: 0.20
    envelop_non_thumb_tau_sign: 1.0
    envelop_thumb_tau_sign: -1.0
