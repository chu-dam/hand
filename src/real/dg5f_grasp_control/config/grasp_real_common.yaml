# Common runtime defaults. Hand-specific gains are applied afterward from
# grasp_real_left_gains.yaml or grasp_real_right_gains.yaml.
grasp_real:
  ros__parameters:
    hand_side: left
    joint_state_topic: /dg5f_s_left/joint_states
    effort_topic: /dg5f_s_left/effort_controller/commands
    command_topic: /grasp_type
    pose_topic: /pose_type
    alpha1_topic: /dg5f_grasp_control/alpha1_cmd
    relative_translation_topic: /dg5f_grasp_control/relative_translation_cmd
    relative_rotation_deg_topic: /dg5f_grasp_control/relative_rotation_deg_cmd
    rotation_matrix_topic: /dg5f_grasp_control/rotation_matrix_cmd
    teaching_mode_topic: /dg5f_grasp_control/teaching_mode
    debug_topic: /dg5f_grasp_control/debug
    debug_frame_id: link_base
    debug_publish_hz: 20.0

    dt: 0.005
    hand_limit: 7.5
    log_dt: 0.25

    use_finger_count: 3

    pose_kp: 0.285
    pose_kd: 0.05
    pose_pd_limit: 0.25

    fric_scale: 1.0
    fric_tanh_k: 17.0
    fric_limit: 1.0
    qdot_alpha: 1.0

    alpha1: 3.0
    groped_tau_limit: 3.0
    groped_force_direction_sign: 1.0
    thumb_centroid_bias: 0.5
    # Reject near-degenerate regular-grasp solutions that amplify another alpha
    # beyond this multiple of the thumb alpha1.
    rotation_force_balance_max_alpha_ratio: 10.0
    # Fade the last valid regular-grasp command to zero on a balance failure.
    force_balance_error_ramp_sec: 0.5
    # Per-fingertip Cartesian PD force added to the ordinary grasp force.
    relative_translation_max_m: 0.020
    relative_translation_kp: 600.0
    relative_translation_kd: 6.0
    # Smooth the Cartesian reference instead of applying a position step.
    relative_translation_reference_ramp_sec: 0.7
    # Cartesian translation force limits.
    relative_translation_force_limit: 8.50
    relative_translation_per_finger_force_limit: 5.50
    relative_translation_velocity_alpha: 0.20
    relative_translation_position_tolerance_m: 0.0005
    relative_translation_velocity_tolerance_mps: 0.003
    relative_translation_settle_sec: 0.20
    relative_translation_timeout_sec: 3.0
    jacobian_eps: 0.000001

    min_tip_distance: 0.018
    collision_repel_gain: 100.0
    collision_repel_limit: 0.8

    # Adjacent-joint following for inactive fingers.
    # Index/middle/ring use joint 1; pinky uses joint 2.
    inactive_collision_avoidance_enable: true
    # Follow after adjacent monitored joints approach within 2 degrees.
    inactive_collision_joint_match_tolerance_rad: 0.0349066
    # Release after the source moves 2 degrees beyond the waiting angle.
    inactive_collision_joint_release_margin_rad: 0.0349066
    inactive_collision_pd_kp: 0.5
    inactive_collision_pd_kd: 0.10
    inactive_collision_pd_limit: 0.25
    inactive_collision_joint_limit_margin_rad: 0.03

    # Closed-loop relative rotation for regular grasp types 1..5. Positive is
    # right-hand-rule rotation about the palm normal (link_base -X).
    # Fixed command-time fingertip targets use a normalized Cartesian position
    # force. Explicit D is disabled by default; the real mechanism supplies
    # damping through its transmission and joint friction.
    relative_rotation_max_abs_deg: 10.0
    relative_rotation_reference_ramp_sec: 0.5
    relative_rotation_position_kp: 16.0
    relative_rotation_position_kd: 0.0
    relative_rotation_alpha1_reference: 3.0
    # Doubling alpha1 multiplies the Cartesian rotation gain by 1.67.
    relative_rotation_alpha1_double_gain_scale: 1.67
    # Compensate the measured negative-direction hardware asymmetry.
    relative_rotation_negative_direction_gain_scale: 1.2
    relative_rotation_positive_direction_damping_scale: 1.0
    relative_rotation_position_error_limit_m: 0.025
    relative_rotation_position_tolerance_m: 0.002
    relative_rotation_force_limit: 10.00
    relative_rotation_radius_min: 0.015
    relative_rotation_velocity_alpha: 0.20
    relative_rotation_timeout_sec: 1.0

    rotation_palm_normal_x: -1.0
    rotation_palm_normal_y: 0.0
    rotation_palm_normal_z: 0.0

    # grasp_type=7: floor contact followed by thumb/index pinch hold.
    card_floor_force_n: 3.0
    card_floor_hold_force_n: 3.0
    card_pinch_force_n: 4.0
    card_index_tip_target_deg: 80.0
    card_index_tip_kp: 1.0
    card_index_tip_kd: 0.1
    card_index_tip_tau_limit: 0.50
    card_index_tip_return_deg: 0.0
    card_index_tip_tolerance_deg: 3.0
    card_index_tip_stable_sec: 0.10
    card_tip_stall_threshold_m: 0.0002
    card_floor_stall_sec: 0.20
    card_pinch_stall_sec: 0.10
    card_post_pinch_delay_sec: 2.0
    card_thumb_j1_hold_kp: 0.60
    card_thumb_j1_hold_kd: 0.10
    card_thumb_j1_hold_tau_limit: 0.40
    card_floor_timeout_sec: 2.0
    card_pinch_timeout_sec: 1.0
    card_joint_state_timeout_sec: 0.10

    # grasp_type=6: enveloping grasp mode
    # time-only sequence:
    #   1) index/middle/ring J2 + pinky J3
    #   2) index/middle/ring J3 + pinky J4 + thumb J3
    #   3) index/middle/ring J4 + thumb J4
    # torque per active joint = alpha1 * envelop_tau_scale
    # previous 0.25 was too strong on hardware, so this default is reduced.
    envelop_tau_scale: 0.025
    envelop_joint_delay: 0.20
    envelop_non_thumb_tau_sign: 1.0
    envelop_thumb_tau_sign: -1.0
